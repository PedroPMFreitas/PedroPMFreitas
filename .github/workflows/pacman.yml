name: Generate pacman animation

on:
  schedule: # executa a cada 12 horas
    - cron: "* */12 * * *"
  workflow_dispatch: # permite executar manualmente
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: PedroPMFreitas
          # 🚨 CORREÇÃO IMPORTANTE:
          # Esta action salva o arquivo em uma pasta 'dist' por padrão.
          # Não precisamos mudar o nome do arquivo, apenas saber onde ele está.

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output # O branch onde a imagem será salva
          build_dir: dist     # 📍 A pasta onde a action anterior SALVOU a imagem
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
